<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>首页 - 知识库引擎切换原型</title>
  <link href="https://fonts.googleapis.cn/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'bg-page': '#F6F8FB',
            'bg-card': '#FFFFFF',
            'text-primary': '#152033',
            'text-secondary': '#637089',
            'brand-blue': '#2F6BFF',
            'success-green': '#16A37B',
            'border-divider': '#E6EAF2',
          }
        }
      }
    }
  </script>
  <style>
    @theme {
      --color-bg-page: #F6F8FB;
      --color-bg-card: #FFFFFF;
      --color-text-primary: #152033;
      --color-text-secondary: #637089;
      --color-brand-blue: #2F6BFF;
      --color-success-green: #16A37B;
      --color-border-divider: #E6EAF2;
    }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="bg-bg-page min-h-screen">
  <!-- 顶部导航 -->
  <header class="bg-bg-card border-b border-border-divider sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-6 h-14 flex items-center justify-between">
      <div class="flex items-center gap-8">
        <h1 class="text-lg font-bold text-text-primary">AI-Bid</h1>
        <nav class="flex items-center gap-6">
          <a href="#" class="text-sm font-medium text-brand-blue">工作台</a>
          <a href="#" class="text-sm text-text-secondary hover:text-text-primary transition-colors">设置</a>
        </nav>
      </div>
      <!-- 引擎状态指示器 -->
      <div class="flex items-center gap-2 px-3 py-1.5 bg-bg-page rounded-lg border border-border-divider">
        <div class="w-2 h-2 rounded-full bg-success-green"></div>
        <span class="text-xs text-text-secondary">当前引擎：</span>
        <span class="text-xs font-medium text-text-primary" id="currentEngineName">阿里云百炼</span>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-6">
    <!-- 统计卡片 -->
    <div class="grid grid-cols-4 gap-4 mb-6">
      <div class="bg-bg-card border border-border-divider rounded-xl p-4">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-xs text-text-secondary">项目总数</p>
            <p class="text-xl font-bold text-text-primary mt-1">12</p>
          </div>
          <div class="w-9 h-9 rounded-lg bg-brand-blue/10 flex items-center justify-center">
            <svg class="w-5 h-5 text-brand-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          </div>
        </div>
      </div>
      <div class="bg-bg-card border border-border-divider rounded-xl p-4">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-xs text-text-secondary">知识库数量</p>
            <p class="text-xl font-bold text-text-primary mt-1" id="kbCount">5</p>
          </div>
          <div class="w-9 h-9 rounded-lg bg-success-green/10 flex items-center justify-center">
            <svg class="w-5 h-5 text-success-green" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4"/></svg>
          </div>
        </div>
      </div>
      <div class="bg-bg-card border border-border-divider rounded-xl p-4">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-xs text-text-secondary">处理中</p>
            <p class="text-xl font-bold text-text-primary mt-1">3</p>
          </div>
          <div class="w-9 h-9 rounded-lg bg-amber-500/10 flex items-center justify-center">
            <svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          </div>
        </div>
      </div>
      <div class="bg-bg-card border border-border-divider rounded-xl p-4">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-xs text-text-secondary">已完成</p>
            <p class="text-xl font-bold text-text-primary mt-1">9</p>
          </div>
          <div class="w-9 h-9 rounded-lg bg-success-green/10 flex items-center justify-center">
            <svg class="w-5 h-5 text-success-green" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          </div>
        </div>
      </div>
    </div>

    <!-- 知识库卡片 -->
    <div class="bg-bg-card border border-border-divider rounded-xl mb-6">
      <div class="px-5 py-3.5 border-b border-border-divider flex items-center justify-between">
        <div>
          <h3 class="text-sm font-semibold text-text-primary">知识库</h3>
          <p class="text-xs text-text-secondary">共 5 个知识库</p>
        </div>
        <div class="flex items-center gap-2">
          <!-- 引擎标识 -->
          <div class="flex items-center gap-1.5 px-2 py-1 bg-orange-50 border border-orange-200 rounded-md" id="engineBadge">
            <svg class="w-3.5 h-3.5 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"/></svg>
            <span class="text-xs text-orange-700 font-medium" id="engineBadgeText">百炼</span>
          </div>
          <button class="inline-flex items-center gap-1 px-2.5 py-1 text-xs font-medium text-white bg-brand-blue rounded-md hover:bg-brand-blue-hover transition-colors">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            新建
          </button>
        </div>
      </div>
      <div class="p-4 space-y-2">
        <!-- 百炼知识库列表 -->
        <div id="bailian-list">
          <div class="flex items-center justify-between p-3 rounded-lg hover:bg-bg-page transition-colors cursor-pointer group">
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 rounded-lg bg-orange-50 flex items-center justify-center">
                <svg class="w-4 h-4 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
              </div>
              <div>
                <p class="text-sm font-medium text-text-primary">招标文件知识库</p>
                <p class="text-xs text-text-secondary">12 个文档 · 企业级</p>
              </div>
            </div>
            <svg class="w-4 h-4 text-text-secondary opacity-0 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
          </div>
          <div class="flex items-center justify-between p-3 rounded-lg hover:bg-bg-page transition-colors cursor-pointer group">
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 rounded-lg bg-orange-50 flex items-center justify-center">
                <svg class="w-4 h-4 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
              </div>
              <div>
                <p class="text-sm font-medium text-text-primary">技术方案素材库</p>
                <p class="text-xs text-text-secondary">8 个文档 · 企业级</p>
              </div>
            </div>
            <svg class="w-4 h-4 text-text-secondary opacity-0 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
          </div>
          <div class="flex items-center justify-between p-3 rounded-lg hover:bg-bg-page transition-colors cursor-pointer group">
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 rounded-lg bg-orange-50 flex items-center justify-center">
                <svg class="w-4 h-4 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
              </div>
              <div>
                <p class="text-sm font-medium text-text-primary">安全运营保障库</p>
                <p class="text-xs text-text-secondary">5 个文档 · 企业级</p>
              </div>
            </div>
            <svg class="w-4 h-4 text-text-secondary opacity-0 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
          </div>
        </div>

        <!-- IMA知识库列表（隐藏） -->
        <div id="ima-list" class="hidden">
          <div class="flex items-center justify-between p-3 rounded-lg hover:bg-bg-page transition-colors cursor-pointer group">
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 rounded-lg bg-blue-50 flex items-center justify-center">
                <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
              </div>
              <div>
                <p class="text-sm font-medium text-text-primary">IMA默认知识库</p>
                <p class="text-xs text-text-secondary">IMA引擎 · 智能检索</p>
              </div>
            </div>
            <svg class="w-4 h-4 text-text-secondary opacity-0 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
          </div>
          <!-- IMA无更多知识库时的提示 -->
          <div class="text-center py-4">
            <p class="text-xs text-text-secondary">IMA引擎仅显示已配置的知识库</p>
          </div>
        </div>
      </div>
    </div>

    <!-- 演示切换按钮 -->
    <div class="fixed bottom-6 right-6 z-50">
      <div class="bg-bg-card border border-border-divider rounded-xl shadow-lg p-4">
        <p class="text-xs text-text-secondary mb-2 font-medium">演示：切换引擎</p>
        <div class="flex gap-2">
          <button onclick="switchToBailian()" class="px-3 py-1.5 text-xs font-medium rounded-lg border transition-colors" id="btn-bailian">百炼</button>
          <button onclick="switchToIMA()" class="px-3 py-1.5 text-xs font-medium rounded-lg border transition-colors" id="btn-ima">IMA</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    let currentEngine = 'bailian';

    function switchToBailian() {
      currentEngine = 'bailian';
      document.getElementById('currentEngineName').textContent = '阿里云百炼';
      document.getElementById('bailian-list').classList.remove('hidden');
      document.getElementById('ima-list').classList.add('hidden');
      document.getElementById('kbCount').textContent = '5';
      // Update engine badge
      document.getElementById('engineBadge').className = 'flex items-center gap-1.5 px-2 py-1 bg-orange-50 border border-orange-200 rounded-md';
      document.getElementById('engineBadgeText').textContent = '百炼';
      document.getElementById('engineBadgeText').className = 'text-xs text-orange-700 font-medium';
      // Update demo buttons
      document.getElementById('btn-bailian').className = 'px-3 py-1.5 text-xs font-medium rounded-lg border border-brand-blue bg-brand-blue text-white transition-colors';
      document.getElementById('btn-ima').className = 'px-3 py-1.5 text-xs font-medium rounded-lg border border-border-divider text-text-secondary hover:border-brand-blue transition-colors';
    }

    function switchToIMA() {
      currentEngine = 'ima';
      document.getElementById('currentEngineName').textContent = 'IMA知识库';
      document.getElementById('bailian-list').classList.add('hidden');
      document.getElementById('ima-list').classList.remove('hidden');
      document.getElementById('kbCount').textContent = '1';
      // Update engine badge
      document.getElementById('engineBadge').className = 'flex items-center gap-1.5 px-2 py-1 bg-blue-50 border border-blue-200 rounded-md';
      document.getElementById('engineBadgeText').textContent = 'IMA';
      document.getElementById('engineBadgeText').className = 'text-xs text-blue-700 font-medium';
      // Update demo buttons
      document.getElementById('btn-ima').className = 'px-3 py-1.5 text-xs font-medium rounded-lg border border-brand-blue bg-brand-blue text-white transition-colors';
      document.getElementById('btn-bailian').className = 'px-3 py-1.5 text-xs font-medium rounded-lg border border-border-divider text-text-secondary hover:border-brand-blue transition-colors';
    }

    // Initialize
    switchToBailian();
  </script>
</body>
</html>
