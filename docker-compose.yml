version: '3.8'

services:
  ai-bid:
    build: 
      context: .
      dockerfile: Dockerfile
    image: ai-bid:latest
    container_name: ai-bid
    ports:
      - "5000:5000"
    environment:
      # 数据库配置 (Supabase) - 必填
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      # LLM配置 - 必填
      - LLM_API_URL=${LLM_API_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - LLM_API_KEY=${LLM_API_KEY}
      # 管理员认证 - 必填（用于保护设置API）
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN}
      # 可选: 阿里云百炼知识库
      - BAILIAN_API_KEY=${BAILIAN_API_KEY:-}
      - BAILIAN_ENDPOINT=${BAILIAN_ENDPOINT:-}
      # 运行环境
      - NODE_ENV=production
      - PORT=5000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
