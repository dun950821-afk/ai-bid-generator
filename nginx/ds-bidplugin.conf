# 标书模板设计器插件单独禁用长缓存。
#
# DS 默认给 sdkjs-plugins 全部静态资源加一年 immutable 缓存
# （ds-docservice.conf），插件迭代时浏览器会一直用旧文件。
# 本规则只对我们的插件 GUID 生效，且按字典序先于 ds-cache/ds-docservice
# 被 include（nginx 正则 location 先匹配先赢），其余静态资源缓存策略不变。
location ~ "^(/[\d]+\.[\d]+\.[\d]+[\.|-][\w]+)?/(sdkjs-plugins)/(\{C2E8B4B2-1111-4B22-AB22-C2E100000002\}.*)$" {
    add_header Cache-Control "no-cache" always;
    gzip_static on;
    alias /var/www/onlyoffice/documentserver/$2/$3;
}
