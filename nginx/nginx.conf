server {
    listen 80;
    server_name _;

    client_max_body_size 200m;

    # gzip 压缩静态资源: 传输体积减少 ~70%, 显著降低大文件在
    # 不稳定网络下传输中断(ERR_CONTENT_LENGTH_MISMATCH)的概率
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_comp_level 5;

    root /usr/share/nginx/html;
    index index.html;

    # 安全响应头（F-08 加固）。
    # 注意：nginx 的 add_header 不跨层级继承——只要某 location 自己写了
    # add_header（如 Cache-Control），server 级的这些头在该 location 全部失效，
    # 所以下面每个带 add_header 的 location 都必须重复这三行。
    # CSP 暂不启用：SPA + OnlyOffice iframe + 外链渲染服务，白名单未核实前
    # 强上会直接把页面打挂，待按前端实际来源清单评估后单独加。
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "DENY";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Docker 内嵌 DNS：上游容器（web/minio）重建后 IP 会变，静态 proxy_pass
    # 只在 nginx 启动时解析一次，会持续到旧 IP 上 502（页面表现为"数据全没了"）。
    # resolver + 变量形式的 proxy_pass 让每次请求都重新解析。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 禁止 index.html 缓存，确保用户总是获取最新版本。
    # try_files fallback 走 internal rewrite，会进入 location / 而非 = /index.html，
    # 因此 no-cache 必须放在 location / 上才生效；但 /assets/* 带内容 hash 可永久缓存，
    # 故单独分一个 location。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    # Vite 构建产物带内容 hash，文件名变更即视为新文件，可永久缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    location / {
        try_files $uri $uri/ /index.html;
        # index.html（含 SPA fallback）禁止缓存，避免用户拿到旧 hash 引用
        # 已被新构建删除的 chunk（典型表现：Failed to fetch dynamically imported module）
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    location /api/ {
        # 变量形式 proxy_pass：配合 resolver 动态解析上游；$request_uri 原样
        # 透传 /api/... 路径与 query（后端路由本就带 /api/ 前缀）
        set $api_upstream http://web:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 同步 AI 接口（目录校验/分析/生成）单次 LLM 可长达数十秒至数分钟，
        # 读取超时必须大于 gunicorn --timeout 300，否则慢调用中途被 nginx 断开
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 可选：浏览器经 nginx 访问 MinIO，便于生产统一域名。
    location /minio/ {
        # 变量形式 proxy_pass（动态解析）；rewrite 去掉 /minio 前缀，与
        # 原 proxy_pass http://minio:9000/ 的路径映射行为一致
        set $minio_upstream http://minio:9000;
        rewrite ^/minio/(.*)$ /$1 break;
        proxy_pass $minio_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
