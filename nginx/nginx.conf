server {
    listen 80;
    server_name _;

    client_max_body_size 200m;

    root /usr/share/nginx/html;
    index index.html;

    # 禁止 index.html 缓存，确保用户总是获取最新版本。
    # try_files fallback 走 internal rewrite，会进入 location / 而非 = /index.html，
    # 因此 no-cache 必须放在 location / 上才生效；但 /assets/* 带内容 hash 可永久缓存，
    # 故单独分一个 location。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Vite 构建产物带内容 hash，文件名变更即视为新文件，可永久缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        # index.html（含 SPA fallback）禁止缓存，避免用户拿到旧 hash 引用
        # 已被新构建删除的 chunk（典型表现：Failed to fetch dynamically imported module）
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location /api/ {
        proxy_pass http://web:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 同步 AI 接口（目录校验/分析/生成）单次 LLM 可长达数十秒至数分钟，
        # 读取超时必须大于 gunicorn --timeout 300，否则慢调用中途被 nginx 断开
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 可选：浏览器经 nginx 访问 MinIO，便于生产统一域名。
    location /minio/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
